name: dependency-fix-experiment

on:
  push:
    branches: [maintenance-audit]
    paths:
      - .github/workflows/dependency-fix-experiment.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Apply candidate dependency fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Cargo.toml")
          s=p.read_text()
          s=s.replace('quick-xml = "0.38"', 'quick-xml = "0.41"')
          s=s.replace(
              'sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate"] }',
              'sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate"] }'
          )
          p.write_text(s)
          PY
          cargo update
          cargo fmt --all
      - name: Verify dependency graph
        shell: bash
        run: |
          set -euo pipefail
          echo '===== quick-xml ====='
          cargo tree -i quick-xml --target all
          echo '===== rsa ====='
          cargo tree -i rsa --target all || true
          echo '===== audit ====='
          cargo audit
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
      - name: Supply-chain policy
        run: cargo deny check advisories licenses bans sources
