name: dependency-target-audit

on:
  push:
    branches: [maintenance-audit]
    paths:
      - .github/workflows/dependency-target-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve candidate graph and print exact ancestry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Cargo.toml")
          s=p.read_text()
          s=s.replace('quick-xml = "0.38"', 'quick-xml = "0.41"')
          s=s.replace(
              'sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate"] }',
              'sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate"] }'
          )
          p.write_text(s)
          PY
          cargo update
          for spec in             quick-xml@0.38.4             rsa@0.9.10             time@0.3.45             proc-macro-error@1.0.4             unic-char-property@0.9.0             unic-char-range@0.9.0             unic-common@0.9.0             unic-ucd-ident@0.9.0             unic-ucd-version@0.9.0             glib@0.18.5; do
            echo "===== $spec ====="
            cargo tree -i "$spec" --target all || true
          done
